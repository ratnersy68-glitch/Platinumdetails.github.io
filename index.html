<!DOCTYPE html>
<html>
<head>
  <title>My Site</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    .container {
      margin-top: 100px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Welcome</h1>
    <p>This is my first cool website</p>
    <a href="#" class="btn">Click Me</a>
  </div>
</body>
</html>
